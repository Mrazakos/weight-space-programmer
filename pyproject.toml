[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-space-programmer"
version = "0.2.0"
description = "wsp: a metered toolkit for LLM agents that read and write neural-network weights directly"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3", "joblib"]
torch = ["torch>=2.1", "pillow>=10"]
safetensors = ["safetensors>=0.4"]
all = ["torch>=2.1", "pillow>=10", "scikit-learn>=1.3", "joblib", "safetensors>=0.4"]
dev = ["pytest>=7", "torch>=2.1", "pillow>=10", "scikit-learn>=1.3", "joblib"]

[project.scripts]
wsp = "wsp.cli:main"

[project.urls]
Homepage = "https://github.com/Mrazakos/weight-space-programmer"

[tool.setuptools]
packages = ["wsp"]
